<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emotion Detector</title>
    <style>
        body { background: #f4f7fb; color: #172033; font-family: Arial, sans-serif; margin: 0; }
        main { background: #fff; border-radius: 12px; box-shadow: 0 8px 28px #1720331a; margin: 48px auto; max-width: 720px; padding: 32px; }
        h1 { margin-top: 0; }
        label { display: block; font-weight: 700; margin: 20px 0 8px; }
        textarea { border: 1px solid #9aa8bc; border-radius: 6px; box-sizing: border-box; font: inherit; min-height: 120px; padding: 12px; resize: vertical; width: 100%; }
        button { background: #1259c3; border: 0; border-radius: 6px; color: #fff; cursor: pointer; font: inherit; font-weight: 700; margin-top: 16px; padding: 11px 18px; }
        button:hover { background: #0d4599; }
        #system_response { background: #edf4ff; border-left: 4px solid #1259c3; margin-top: 24px; min-height: 24px; padding: 14px; }
    </style>
</head>
<body>
    <main>
        <h1>Emotion Detector</h1>
        <p>Enter a sentence to identify its strongest emotion.</p>
        <label for="textToAnalyze">Text to analyze</label>
        <textarea id="textToAnalyze" placeholder="For example: I am happy today."></textarea>
        <button type="button" onclick="runEmotionDetector()">Analyze emotion</button>
        <div id="system_response" aria-live="polite">Your result will appear here.</div>
    </main>
    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</body>
</html>
